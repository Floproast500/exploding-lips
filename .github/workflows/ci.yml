name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libdbus-1-dev pkg-config cmake libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev
      # Linux also checks the SDL3 gamepad backend (SDL3 built from source).
      - name: Features
        shell: bash
        run: echo "FEATURES=godd-net/game${{ runner.os == 'Linux' && ',lips-desktop/sdl-build' || '' }}" >> "$GITHUB_ENV"
      # Tests that need the original game files skip themselves when original/ is absent.
      - run: cargo test --workspace --features ${{ env.FEATURES }}
      - run: cargo clippy --workspace --all-targets --features ${{ env.FEATURES }} -- -D warnings

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build -p lips-web -p godd-formats -p godd-game -p godd-net --target wasm32-unknown-unknown --release

  # The Windows installer (Inno Setup, preinstalled on the runner). It carries no game files:
  # its last step downloads the game from the Internet Archive.
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p lips-desktop -p packbuilder
      - run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DVersion=0.1.0 packaging\windows\biglips.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: biglips-windows-installer
          path: target/installer/*.exe
