[workspace]
resolver = "3"
members = ["crates/*", "tools/lipstool", "tools/packbuilder", "tools/playbot"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
engine-core = { path = "crates/engine-core" }
engine-scene = { path = "crates/engine-scene" }
engine-gpu = { path = "crates/engine-gpu" }
engine-audio = { path = "crates/engine-audio" }
quake-bsp = { path = "crates/quake-bsp" }
godd-formats = { path = "crates/godd-formats" }
godd-game = { path = "crates/godd-game" }
godd-net = { path = "crates/godd-net" }
log = "0.4"
thiserror = "2"
