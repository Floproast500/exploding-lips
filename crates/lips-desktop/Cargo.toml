[package]
name = "lips-desktop"
description = "Native front end for the Exploding Lips reimplementation"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
godd-game.workspace = true
godd-net = { workspace = true, features = ["game"] }
bytemuck = { version = "1", features = ["derive"] }
