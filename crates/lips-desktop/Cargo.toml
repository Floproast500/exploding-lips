[package]
name = "lips-desktop"
description = "Native front end for the Exploding Lips reimplementation"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
sdl3-sys = { version = "0.7", optional = true }
engine-core.workspace = true
engine-gpu.workspace = true
engine-audio.workspace = true
engine-scene.workspace = true
quake-bsp.workspace = true
godd-game.workspace = true
godd-net = { workspace = true, features = ["game"] }
bytemuck = { version = "1", features = ["derive"] }
env_logger = "0.11"
gilrs = "0.11"
log.workspace = true
pollster = "1"
softbuffer = "0.4"
wgpu = "30"
winit = "0.30"

[features]
# SDL3 gamepads: gyro aiming and rumble (needs the system SDL3 library).
sdl = ["dep:sdl3-sys"]
