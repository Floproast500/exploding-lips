[package]
name = "lips-web"
description = "WebAssembly front end for the Exploding Lips reimplementation"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
godd-game.workspace = true
engine-core.workspace = true
engine-scene.workspace = true
engine-gpu.workspace = true
engine-audio.workspace = true
wgpu = { version = "30", features = ["webgl"] }
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
wasm-bindgen = "=0.2.129"
godd-net.workspace = true
js-sys = "0.3"
web-sys = { version = "0.3", features = ["WebSocket", "BinaryType", "MessageEvent", "ErrorEvent", "CloseEvent", "console", "HtmlCanvasElement"] }
