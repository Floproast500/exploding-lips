<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Big Lips</title>
  <style>
    :root { color-scheme: dark; --bg: #0b0b0d; --fg: #e8e2dc; --muted: #9a928b; --accent: #d8263a; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
    #setup { max-width: 34rem; margin: 10vh auto; padding: 0 16px; }
    h1 { color: var(--accent); margin: 0 0 .5rem; }
    p { color: var(--muted); }
    label.button { display: inline-block; padding: .6rem 1rem; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }
    input[type=file] { display: none; }
    canvas { display: none; position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; background: #000; }
    #status { margin-top: 1rem; min-height: 1.5em; }
  </style>
</head>
<body>
  <div id="setup">
    <h1>Exploding Lips</h1>
    <p>Reimplementation of the 1999 G.O.D.D. engine game. Choose the folder containing your copy of
      the game (it must include <code>lips.bmp</code> and the <code>LIPS*.XRB</code> files). Files stay in your browser.</p>
    <label class="button">Choose game folder<input id="folder" type="file" webkitdirectory multiple></label>
    <div id="status"></div>
  </div>
  <canvas id="screen"></canvas>
  <script type="module">
    import init, { Loader, create_gpu } from "./pkg/lips_web.js";
    await init();

    const status = document.getElementById("status");
    let canvas = document.getElementById("screen");
    let ctx = null; // 2D context when there is no GPU
    window.lipsRenderer = "starting";

    // Testing/hosting hook: ?data=<base url> fetches <base>/manifest.json (a list of relative
    // paths) and the files themselves instead of asking for a folder. Optional &level=LIPS00.
    const params = new URLSearchParams(location.search);
    if (params.has("data")) {
      const base = params.get("data").replace(/\/$/, "");
      const list = await (await fetch(`${base}/manifest.json`)).json();
      const loader = new Loader();
      let done = 0;
      await Promise.all(list.map(async (path) => {
        const bytes = new Uint8Array(await (await fetch(`${base}/${path}`)).arrayBuffer());
        loader.add_file(`game/${path}`, bytes);
        status.textContent = `Loading ${++done} / ${list.length}`;
      }));
      boot(loader, params.get("level"));
    }

    document.getElementById("folder").addEventListener("change", async (event) => {
      const files = [...event.target.files];
      const loader = new Loader();
      let done = 0;
      for (const file of files) {
        loader.add_file(file.webkitRelativePath || file.name, new Uint8Array(await file.arrayBuffer()));
        status.textContent = `Loading ${++done} / ${files.length}`;
      }
      boot(loader, null);
    });

    async function boot(loader, level) {
      if (!loader.ready()) {
        status.textContent = "That folder does not look like an Exploding Lips install (lips.bmp / LIPSTART.XRB missing).";
        return;
      }
      try {
        const stored = localStorage.getItem("lips-save");
        if (stored) loader.set_save(Uint8Array.from(atob(stored), (c) => c.charCodeAt(0)));
        // Stored options, then any ?set=NAME%20VALUE overrides (testing and links).
        const lines = [localStorage.getItem("lips-config") ?? "", ...params.getAll("set").map((v) => `set ${v}`)];
        loader.set_config(lines.join("\n"));
        for (let n = 0; n < 8; n++) {
          const slot = localStorage.getItem(`lips-slot-${n}`);
          if (slot) loader.set_slot(n, slot);
        }
      } catch { /* storage unavailable: use the folder's save and default options */ }
      let game;
      try {
        game = loader.start(level ?? undefined);
      } catch (e) {
        status.textContent = `Could not start: ${e}`;
        return;
      }
      document.getElementById("setup").style.display = "none";
      canvas.style.display = "block";
      // GPU renderer (WebGPU, else WebGL2; ?renderer=webgl forces WebGL2) unless
      // ?renderer=software; without a GPU, a 2D canvas.
      canvas.width = canvas.clientWidth || 640;
      canvas.height = canvas.clientHeight || 480;
      let gpu = null;
      if (params.get("renderer") !== "software") {
        try { gpu = await create_gpu(canvas, params.get("renderer") === "webgl"); } catch (e) { console.warn("GPU unavailable:", e); }
      }
      if (gpu) {
        window.lipsRenderer = gpu.backend();
        game.attach_gpu(gpu);
      } else {
        // A canvas that tried a GPU context cannot switch to 2D: use a fresh one.
        const fresh = canvas.cloneNode();
        canvas.replaceWith(fresh);
        canvas = fresh;
        canvas.style.display = "block";
        ctx = canvas.getContext("2d");
        window.lipsRenderer = "software";
      }
      document.title = "Big Lips — running";
      if (params.has("join")) {
        try { game.connect(params.get("join"), params.get("name") ?? "browser"); } catch (e) { console.error(e); }
      }
      run(game);
    }

    function run(game) {
      // Browsers start audio only from a user gesture.
      const startAudio = () => game.start_audio();
      addEventListener("keydown", startAudio, { once: true });
      addEventListener("pointerdown", startAudio, { once: true });
      const keyHandler = (down) => (e) => {
        if (down) game.type_text(e.key);
        if (game.key(e.code, down)) e.preventDefault();
      };
      addEventListener("keydown", keyHandler(true));
      addEventListener("keyup", keyHandler(false));
      const locked = () => document.pointerLockElement === canvas;
      canvas.addEventListener("mousedown", (e) => {
        if (!locked()) { canvas.requestPointerLock?.(); return; } // the first click only captures
        game.mouse_button(e.button, true);
        e.preventDefault();
      });
      addEventListener("mouseup", (e) => { if (locked()) game.mouse_button(e.button, false); });
      canvas.addEventListener("contextmenu", (e) => e.preventDefault());
      canvas.addEventListener("wheel", (e) => { if (locked()) { game.wheel(e.deltaY); e.preventDefault(); } }, { passive: false });
      addEventListener("mousemove", (e) => { if (locked()) game.mouse_move(e.movementX, e.movementY); });
      addEventListener("blur", () => game.release_all());

      let last = performance.now();
      const frame = (now) => {
        // Render at the canvas's CSS size (Hor+ widescreen), capped for performance.
        const scale = Math.min(devicePixelRatio || 1, 2);
        const w = Math.max(1, Math.round(canvas.clientWidth * scale));
        const h = Math.max(1, Math.round(canvas.clientHeight * scale));
        if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
        let rgba = null;
        if (ctx) rgba = game.frame(now - last, w, h); else game.frame_gpu(now - last, w, h);
        const config = game.take_config();
        if (config) {
          try { localStorage.setItem("lips-config", config); } catch { /* ignore */ }
        }
        const slots = game.take_slots();
        for (let i = 0; i + 1 < slots.length; i += 2) {
          try { localStorage.setItem(`lips-slot-${slots[i]}`, slots[i + 1]); } catch { /* ignore */ }
        }
        const save = game.take_save();
        if (save) {
          try { localStorage.setItem("lips-save", btoa(String.fromCharCode(...save))); } catch { /* ignore */ }
        }
        last = now;
        if (rgba) ctx.putImageData(new ImageData(new Uint8ClampedArray(rgba.buffer, rgba.byteOffset, rgba.length), w, h), 0, 0);
        requestAnimationFrame(frame);
      };
      requestAnimationFrame(frame);
    }
  </script>
</body>
</html>
